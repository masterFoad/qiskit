---
features_transpiler:
  - |
    The default translation stage of the preset pass managers at ``optimization_level`` 2 and 3
    now first moves a two-qubit interaction on the qubit pair of a ``swap`` directly next to that
    ``swap``, when the interaction commutes with every operation in between on those two qubits.
    The :class:`.TwoQubitPeepholeOptimization` pass then synthesizes the ``swap`` and the
    interaction as a single block, for example two two-qubit gates instead of four for a ``swap``
    followed by a ``cx``, or three instead of four for a ``swap`` next to a ``cp``.  Moved
    interactions are standard gates such as ``cx``, ``cz``, ``cp``, ``rzz`` and ``rxx``, diagonal
    two-qubit :class:`.UnitaryGate` instances, and ``cx``-``rz``-``cx`` blocks.  Commutation is
    decided exactly, and an interaction is never moved across a ``swap``.  This follows the
    optimization-aware SWAP cost of `Liu, Li and Zhou <https://arxiv.org/abs/2205.10596>`__ and
    the dressed-SWAP synthesis of `Lao and Browne <https://arxiv.org/abs/2108.02099>`__.
upgrade_transpiler:
  - |
    The output of :func:`.transpile` and :func:`.generate_preset_pass_manager` at
    ``optimization_level`` 2 and 3 can change for circuits that contain a ``swap`` after routing.
    Routed circuits with many commuting interactions, such as QAOA circuits, can need fewer
    two-qubit gates, while total depth can rise where a merged block needs more single-qubit
    gates.  Layout and routing are unchanged.  A ``swap`` is left in place when one of its qubits
    does no further multi-qubit work after it.  At ``optimization_level=3`` on a
    :class:`.Target` with angle bounds, for example a fractional ``rzz``, controlled phases
    (``cp``, ``cu1``, ``cs`` and ``csdg``) are not moved, because the merged blocks would make the
    optimization loop run for many more iterations.
