---
features_transpiler:
  - |
    The routing stage of the preset pass managers at ``optimization_level`` 2 and 3 now ends by
    moving a two-qubit interaction on the qubit pair of a ``swap`` directly next to that
    ``swap``, when the interaction commutes with every operation in between on those two qubits.
    Because this is part of the routing stage, it also runs when a backend selects its own
    translation stage plugin.  The :class:`.TwoQubitPeepholeOptimization` pass then synthesizes
    the ``swap`` and the interaction as a single block, for example two two-qubit gates instead of
    four for a ``swap`` followed by a ``cx``, or three instead of five for a ``swap`` next to a
    ``cp`` on a ``cx`` or ``cz`` target.  Moved interactions are standard gates such as ``cx``,
    ``cz``, ``cp``, ``rzz`` and ``rxx``, diagonal two-qubit :class:`.UnitaryGate` instances, and
    ``cx``-``rz``-``cx`` blocks.  Commutation is decided exactly, and an interaction is never moved
    across a ``swap``.  This follows the optimization-aware SWAP cost of
    `Liu, Li and Zhou <https://arxiv.org/abs/2205.10596>`__ and the dressed-SWAP synthesis of
    `Lao and Browne <https://arxiv.org/abs/2108.02099>`__.
  - |
    Added a new argument ``optimization_level`` to :func:`.generate_routing_passmanager`.  When it
    is 2 or 3, the generated routing stage ends with the step that moves two-qubit interactions
    next to ``swap`` gates.  When it is ``None`` (the default), the routing stage is unchanged.
upgrade_transpiler:
  - |
    The output of :func:`.transpile` and :func:`.generate_preset_pass_manager` at
    ``optimization_level`` 2 and 3 can change for circuits that contain a ``swap`` after routing.
    Routed circuits with many commuting interactions, such as QAOA circuits, can need fewer
    two-qubit gates, while total depth can rise where a merged block needs more single-qubit
    gates.  On rare inputs the two-qubit count can increase slightly, because later passes see a
    different circuit.  The swaps chosen by routing are unchanged, but at ``optimization_level=3``
    the final :class:`.VF2PostLayout` can choose a different physical layout for the changed
    circuit.  A ``swap`` is left in place when one of its qubits does no further multi-qubit work
    after it.  At ``optimization_level=3`` a ``swap`` is also left in place when one of its qubits
    has a :class:`.Target` T2 below 10 microseconds, is not measured afterwards, and all its
    remaining multi-qubit operations, other than the moved interaction, act on the same set of
    qubits.
    Routing stage plugins that do not pass ``optimization_level`` to
    :func:`.generate_routing_passmanager` do not run this step.
fixes:
  - |
    The optimization loop of the preset pass managers at ``optimization_level=3`` now runs
    :class:`.WrapAngles` right after :class:`.TwoQubitPeepholeOptimization` when the
    :class:`.Target` has angle bounds, for example a fractional ``rzz`` bounded to ``[0, pi/2]``.
    The peephole could synthesize angles outside those bounds, so the basis check in the loop
    failed in every iteration and the loop did not reach a fixed point.  The loop now converges in
    fewer iterations on such targets, and its output on them can change even for circuits that
    contain no ``swap``.
