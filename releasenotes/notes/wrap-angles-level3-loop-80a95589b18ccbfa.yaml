---
fixes:
  - |
    The optimization loop of the preset pass managers at ``optimization_level=3`` now runs
    :class:`.WrapAngles` right after :class:`.TwoQubitPeepholeOptimization` when the
    :class:`.Target` has angle bounds, for example a fractional ``rzz`` bounded to ``[0, pi/2]``.
    The peephole could synthesize angles outside those bounds, so the basis check in the loop
    failed in every iteration and the loop did not reach a fixed point.  The loop now converges in
    fewer iterations on such targets, and its output on them can change even for circuits that
    contain no ``swap``.
